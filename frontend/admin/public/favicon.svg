<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The same mark as the customer app, plus a dot in the admin colour (muted plum, the admin colour role) in the corner, so the two tabs tell apart at 16px (W26-R23). -->
  <style>
    .o { stroke: #1c1a16; }
    .s { stroke: #9a7a2e; }
    .d { fill: #6b3f69; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) { .o { stroke: #efe9dc; } .s { stroke: #c9a55a; } .d { fill: #c79bc4; stroke: #3c4043; } }
  </style>
  <rect class="o" x="3" y="3" width="18" height="18" rx="3" fill="none" stroke-width="2.2" />
  <path class="s" d="M12 4v9M12 9l-4 3M12 9l4 3" fill="none" stroke-width="2.2" stroke-linecap="round" />
  <circle class="d" cx="19" cy="19" r="5.6" stroke-width="1.6" />
</svg>
