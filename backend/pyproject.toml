[project]
name = "rootsquares-backend"
version = "0.1.0"
description = "rootsquares backend: platform (control plane) and square (data plane) in one deployable"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1",
    "flask-cors>=4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23",
    "pyjwt[crypto]>=2.9",
    "spectree[flask,pydantic]>=1.4",
    "httpx>=0.27",
    "email-validator>=2",
    "boto3>=1.43.110",
    "alembic>=1.13",
    "stripe>=16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true
