# Alembic for the platform database. Run it through flask (it reads DATABASE_URL from backend/.env):
#   .\.venv\Scripts\python.exe -m flask --app app.main:create_app db upgrade
# script_location and the database URL are set in code (app/shared/migrations.py), not here.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
